name: Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15.0-rc.3']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install pip==26.2.1
        python -m pip install -e .[testing]
        python -m pip install pre-commit==4.6.2
    - name: Ensure pre-commit was applied
      run: |
        pre-commit run --all-files
    - name: Test
      run: |
        pytest --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
    - name: Upload test results to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Test packages creation
      run: |
        python -m pip install build==1.6.1
        python -m build .
