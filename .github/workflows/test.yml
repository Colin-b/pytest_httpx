name: Test

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
    - uses: actions/checkout@b9e0990d219a03df7633c93f6f005a8fecbcab22 # v6.0.2
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install pip==26.1
        python -m pip install -e .[testing]
        python -m pip install pre-commit==4.6.0
    - name: Ensure pre-commit was applied
      run: |
        pre-commit run --all-files
    - name: Test
      run: |
        pytest --cov-report=xml --junitxml=junit.xml -o junit_family=legacy
    - name: Upload test results to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        report_type: test_results
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
    - name: Test packages creation
      run: |
        python -m pip install build==1.4.4
        python -m build .
