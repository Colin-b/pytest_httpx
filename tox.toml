env_list = ["clean", "httpx", "httpx2", "both"]
isolated_build = true

[env_run_base]
# Editable mode so that coverage measures the repo source.
package = "editable"
extras = ["testing", "{env_name}"]
commands = [
    ["pytest", "--cov-append", { replace = "posargs", extend = true }],
]

[env.clean]
skip_install = true
deps = ["coverage[toml]"]
commands = [["coverage", "erase"]]

[env.both]
# The "both" environment needs both extras, so override the {env_name}-derived one.
extras = ["testing", "httpx", "httpx2"]
